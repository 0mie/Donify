name: Auto-Sync Tiltify Live Auctions to Short.io & GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-auction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Auction Sync Script
        env:
          SHORT_IO_API_KEY: ${{ secrets.SHORT_IO_API_KEY }}
          SHORT_IO_LINK_ID: ${{ secrets.SHORT_IO_LINK_ID }}
          TILTIFY_CLIENT_ID: ${{ secrets.TILTIFY_CLIENT_ID }}
          TILTIFY_CLIENT_SECRET: ${{ secrets.TILTIFY_CLIENT_SECRET }}
          TILTIFY_AUCTION_HOUSE_ID: ${{ secrets.TILTIFY_AUCTION_HOUSE_ID }}
          TILTIFY_REDIRECT_URL: ${{ secrets.TILTIFY_REDIRECT_URL }}
          ACTIVE_AUCTION_TITLE: ${{ vars.ACTIVE_AUCTION_TITLE || secrets.ACTIVE_AUCTION_TITLE }}
          ACTIVE_AUCTION_DESCRIPTION: ${{ vars.ACTIVE_AUCTION_DESCRIPTION || secrets.ACTIVE_AUCTION_DESCRIPTION }}
          IDLE_AUCTION_TITLE: ${{ vars.IDLE_AUCTION_TITLE || secrets.IDLE_AUCTION_TITLE }}
          IDLE_AUCTION_DESCRIPTION: ${{ vars.IDLE_AUCTION_DESCRIPTION || secrets.IDLE_AUCTION_DESCRIPTION }}
        run: node sync-auction.js

      - name: Deploy Rich OpenGraph Preview Page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
