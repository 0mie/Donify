name: Auto-Sync Tiltify Soonest Auction to Short.io

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync-auction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Auction Sync Script
        env:
          SHORT_IO_API_KEY: ${{ secrets.SHORT_IO_API_KEY }}
          SHORT_IO_LINK_ID: ${{ secrets.SHORT_IO_LINK_ID }}
          TILTIFY_CAMPAIGN_ID: ${{ secrets.TILTIFY_CAMPAIGN_ID }}
        run: node sync-auction.js
