name: Auto-Sync Tiltify Soonest Auction to Short.io

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-auction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Auction Sync Script
        env:
          SHORT_IO_API_KEY: ${{ secrets.SHORT_IO_API_KEY }}
          SHORT_IO_LINK_ID: ${{ secrets.SHORT_IO_LINK_ID }}
          TILTIFY_CLIENT_ID: ${{ secrets.TILTIFY_CLIENT_ID }}
          TILTIFY_CLIENT_SECRET: ${{ secrets.TILTIFY_CLIENT_SECRET }}
        run: node sync-auction.js

      - name: Deploy Rich OpenGraph Preview Page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
